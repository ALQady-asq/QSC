plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Supply the original signing key through local environment variables or GitHub Secrets.
// Missing credentials keep the release unsigned; partial credentials are a configuration error.
def releaseSigning = [
        storeFile: providers.environmentVariable('QSC_KEYSTORE_FILE').orNull,
        storePassword: providers.environmentVariable('QSC_KEYSTORE_PASSWORD').orNull,
        keyAlias: providers.environmentVariable('QSC_KEY_ALIAS').orNull,
        keyPassword: providers.environmentVariable('QSC_KEY_PASSWORD').orNull,
]
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.isEmpty() }
if (!hasReleaseSigning && releaseSigning.values().any { it != null && !it.isEmpty() }) {
    throw new GradleException('Provide all four QSC release signing environment variables.')
}

android {
    namespace 'com.openrecorder.app'
    compileSdk 37

    defaultConfig {
        applicationId 'com.openrecorder.app.matepad'
        minSdk 29
        targetSdk 36
        versionCode 10009
        versionName '1.2.4'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            originalRelease {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.originalRelease
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        performance {
            initWith release
            debuggable false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
        development {
            applicationIdSuffix '.test'
            debuggable true
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.2'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.media3:media3-muxer:1.11.1'
    implementation 'androidx.camera:camera-camera2:1.6.1'
    implementation 'androidx.camera:camera-lifecycle:1.6.1'
    implementation 'androidx.camera:camera-video:1.6.1'
    implementation 'androidx.camera:camera-view:1.6.1'
    implementation 'org.jetbrains.compose.ui:ui:1.11.1'
    implementation 'org.jetbrains.compose.foundation:foundation:1.11.1'
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.3'
    implementation 'top.yukonga.miuix.kmp:miuix-preference:0.9.3'
    testImplementation 'junit:junit:4.13.2'
}
